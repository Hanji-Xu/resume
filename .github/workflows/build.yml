name: Build resume PDF
on:
  push:
    paths: ["resume.tex", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
      - run: mv resume.pdf Hanji-Xu-Resume.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: Hanji-Xu-Resume
          path: Hanji-Xu-Resume.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild Hanji-Xu-Resume.pdf"
          file_pattern: Hanji-Xu-Resume.pdf
